<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter Archive — Congregation Tifereth Israel</title><link rel="stylesheet" href="assets/styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><div class="wrap nav"><a class="brand" href="index.html">Congregation Tifereth Israel</a><nav class="links"><a href="about.html">About</a><a href="history.html">Our History</a><a href="leadership.html">Leadership Team</a><a href="services.html">Services</a><a href="newsletter.html">Newsletter</a><a href="meldados.html">Meldathos</a></nav></div></header><main id="main"><section class="page-hero"><div class="wrap"><h1>Newsletter Archive</h1><p class="lead">Congregation Tifereth Israel newsletters, organized by publication year.</p><p><a href="newsletter.html">Back to Newsletter</a></p></div></section><section><div class="wrap" id="archive"><p>Loading newsletter archive…</p></div></section></main><script src="assets/site.js"></script><script>(async()=>{const root=document.getElementById('archive');try{const r=await fetch('content/newsletters.json',{cache:'no-cache'});if(!r.ok)throw Error('Archive unavailable');const data=await r.json();const grouped=new Map();for(const issue of data.issues||[]){const year=issue.year||Number((issue.date||'').slice(0,4));if(!grouped.has(year))grouped.set(year,[]);grouped.get(year).push(issue)}root.replaceChildren();for(const [year,items] of [...grouped].sort((a,b)=>b[0]-a[0])){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=year;section.append(heading);const list=document.createElement('ul');for(const issue of items.sort((a,b)=>b.date.localeCompare(a.date))){const li=document.createElement('li');const a=document.createElement('a');a.href=issue.url;a.target='_blank';a.rel='noopener';a.textContent=issue.title+' — '+issue.volume;li.append(a);list.append(li)}section.append(list);root.append(section)}}catch(e){root.textContent='Unable to load the newsletter archive. Please try again later.'}})();</script></body></html>
