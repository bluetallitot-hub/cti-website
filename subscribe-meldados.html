<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meldado Notifications | Congregation Tifereth Israel</title><link rel="stylesheet" href="assets/styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/images/branding/CTI-logo-web.png" alt="Congregation Tifereth Israel"></a><nav class="links"><a href="torah.html">D’var Torah</a><a href="meldados.html">Meldados</a></nav></div></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow">Stay Connected</div><h1>Meldado Notifications</h1><p class="lead">Choose the loved ones whose Hebrew memorial anniversaries you wish to remember.</p></div></section><section><div class="wrap" style="max-width:760px"><h2>Meldado reminder subscriptions</h2><form id="subscribe-form" class="card" style="display:grid;gap:18px"><label style="display:block">Your name<input style="display:block;width:100%;box-sizing:border-box;margin-top:8px" name="name" autocomplete="name" required></label><label style="display:block">Email address<input style="display:block;width:100%;box-sizing:border-box;margin-top:8px" name="email" type="email" autocomplete="email" required></label><div><label for="memorial-0" style="display:block;margin-bottom:8px">Select a memorial name</label><div id="memorial-options" style="display:grid;gap:14px"><div><label for="memorial-1" style="display:block;margin-bottom:8px">Memorial name</label><select id="memorial-1" name="memorial" required style="display:block;width:100%;box-sizing:border-box;min-height:44px"><option value="">Loading memorial names…</option></select></div></div><button id="add-memorial" type="button" class="btn" style="margin-top:14px">+ Add an additional name</button><p id="memorial-count" style="font-size:.9rem"></p></div><p>Individual memorial reminders are sent with all subscribers for that memorial visible together in the To field.</p><label><input type="checkbox" name="consent" required> I understand that other subscribers to the same memorial can see my name and email address.</label><button class="btn primary" type="submit">Subscribe</button><p id="status" role="status" aria-live="polite"></p></form></div></section></main><script src="assets/site.js"></script><script>
(function(){
const form=document.getElementById('subscribe-form');
const holder=document.getElementById('memorial-options');
const button=document.getElementById('add-memorial');
const count=document.getElementById('memorial-count');
const status=document.getElementById('status');
const original=holder.querySelector('select');
let choices=[];
fetch('content/meldados.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load memorial directory');return r.json()}).then(data=>{
 const people=Array.isArray(data.people)?data.people:[];
 const surname=name=>{const parts=name.trim().split(/\s+/);return [parts.pop()||'',parts.join(' ')]};
 choices=people.filter(p=>p.approved===true||p.reviewStatus==='approved').map(p=>({value:String(p.id),text:String(p.englishName||p.name||'')})).filter(p=>p.value&&p.text).sort((a,b)=>{const x=surname(a.text),y=surname(b.text);return x[0].localeCompare(y[0])||x[1].localeCompare(y[1])});
 original.replaceChildren(new Option('Select a name',''));
 choices.forEach(p=>original.append(new Option(p.text,p.value)));
 refresh();
}).catch(()=>{original.replaceChildren(new Option('Memorial names unavailable',''));status.textContent='Unable to load the memorial directory. Please reload the page.';button.disabled=true});
function selects(){return Array.from(holder.querySelectorAll('select'))}
function refresh(){
 const fields=selects(),used=fields.map(s=>s.value).filter(Boolean);
 fields.forEach(s=>Array.from(s.options).forEach(o=>{if(o.value)o.disabled=used.includes(o.value)&&s.value!==o.value}));
 button.disabled=choices.length===0||fields.length>=10||!fields[fields.length-1].value;
 button.hidden=fields.length>=10;
 count.textContent=fields.length+' of 10 memorial names';
}
function addField(){
 if(!choices.length||selects().length>=10)return;
 const n=selects().length+1;
 const box=document.createElement('div');
 const label=document.createElement('label');
 label.textContent='Additional memorial name '+n;
 label.style.display='block';
 const select=document.createElement('select');
 select.name='memorial';
 select.required=true;
 select.style.cssText='display:block;width:100%;box-sizing:border-box;min-height:44px;margin-top:8px';
 select.append(new Option('Select a name',''));
 choices.forEach(o=>select.append(new Option(o.text,o.value)));
 select.addEventListener('change',refresh);
 const remove=document.createElement('button');
 remove.type='button';remove.className='btn';remove.textContent='Remove name';
 remove.style.marginTop='8px';
 remove.addEventListener('click',()=>{box.remove();refresh()});
 box.append(label,select,remove);holder.append(box);refresh();
}
original.addEventListener('change',refresh);
button.addEventListener('click',addField);
refresh();
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const ids=selects().map(s=>s.value).filter(Boolean);
 if(!ids.length||ids.length!==new Set(ids).size){status.textContent='Please select different memorial names.';return}
 status.textContent='Submitting…';
 try{
  const response=await fetch('/api/meldado-subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.querySelector('[name="name"]').value.trim(),email:form.querySelector('[name="email"]').value.trim(),memorial_ids:ids,consent:true})});
  if(!response.ok)throw new Error('Subscription unavailable');
  status.textContent='Please check your email to confirm your subscription.';
 }catch(err){status.textContent='Subscription service is not yet available. Your selections have not been submitted.'}
});
})();
</script></body></html>
