<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Gallery Photograph</title><link rel="stylesheet" href="assets/styles.css"><style>.gallery-detail{max-width:1040px;margin:2rem auto;padding:0 1rem}.gallery-detail figure{margin:0}.gallery-detail img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#f5f2eb;border:1px solid #e3ded4}.gallery-detail figcaption{margin:1rem 0;line-height:1.6}.gallery-detail .links{display:flex;gap:1.5rem;flex-wrap:wrap;margin:1.5rem 0}.gallery-detail .source{color:#53645f}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/images/branding/CTI-logo-web.png" alt="CTI"></a><nav class="links"><a href="gallery.html">Gallery</a><a href="press.html">Press &amp; Archives</a></nav></div></header><main class="gallery-detail"><a href="gallery.html">← Photo Gallery</a><h1 id="title">Gallery photograph</h1><p id="date" class="meta"></p><p id="thanks" class="source" hidden></p><figure><img id="photo" alt=""><figcaption id="caption"></figcaption></figure><div class="links"><a id="original" target="_blank" rel="noopener noreferrer" hidden>Original photo — click here</a><a id="article" hidden>Read associated archive article →</a></div><p id="credit" class="source"></p></main><script src="assets/site.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id');try{const data=await fetch('content/collection-records.json',{cache:'no-cache'}).then(r=>r.json());const x=data.items.find(y=>y.id===id&&y.status==='active'&&(y.collection==='gallery'||y.collection==='archive'||y.photoAlbum===true));if(!x)throw Error('Unavailable');const title=x.galleryPhoto?.caption||x.photoAlbumCaption||x.caption||x.title;document.title=title+' | CTI Photo Gallery';document.getElementById('title').textContent=title;document.getElementById('date').textContent=x.date||'';document.getElementById('caption').textContent=x.galleryPhoto?.description||x.photoAlbumNote||x.description||'';const photo=x.galleryPhoto?.enhancedImage||x.photoAlbumImage||x.restoredImage||x.archiveImage||x.indexImage||x.thumbnailImage;const original=x.galleryPhoto?.originalImage||x.photoAlbumOriginalImage||x.originalImage||x.photoAlbumImage||x.archiveImage||x.indexImage;const image=document.getElementById('photo');if(photo){image.src=photo;image.alt=title}else image.hidden=true;const link=document.getElementById('original');if(original){link.href=original;link.hidden=false}const article=document.getElementById('article');if(x.collection==='archive'||x.relatedArchiveRecordId){article.href='archive-record.html?id='+encodeURIComponent(x.relatedArchiveRecordId||x.id);article.hidden=false}const thanks=document.getElementById('thanks');if(x.archiveAcknowledgment){thanks.textContent=x.archiveAcknowledgment;thanks.hidden=false}document.getElementById('credit').textContent=[x.attribution,x.source].filter(Boolean).join(' · ')}catch(e){document.getElementById('title').textContent='Gallery photograph unavailable'}})();</script></body></html>
