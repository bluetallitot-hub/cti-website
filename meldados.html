<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meldados — CTI Memorial Board (Preview)</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/meldados.css?v=20261020c"></head>
<body><main class="memorial-shell">
<p class="preview-note">Working preview — not yet linked in the CTI website navigation</p>
<header class="meldados-heading"><p class="eyebrow">Congregation Tifereth Israel</p><h1>Meldados</h1><p>Remembering those who came before us</p></header>
<div class="board-stage">
<div class="board-art"><img id="board-image" src="assets/new/Congregation%20Tifereth%20Israel%20Memorial%20Board.png" alt="CTI memorial board with eight columns for Hebrew dates, six blank brass plaques in each column" width="1448" height="1086">
<div id="plaque-grid" class="plaque-grid" aria-label="Memorial plaques by Hebrew date"></div>
<div class="month-overlay" aria-label="Select Hebrew month"><button id="previous" type="button" aria-label="Previous Hebrew month">◀</button><span id="month-label" aria-live="polite">Tishrei</span><button id="next" type="button" aria-label="Next Hebrew month">▶</button></div>
</div></div>
<p class="board-instructions">Choose a month using the arrows on the brass nameplate. Select a named plaque to read the remembrance below.</p>
<section id="memorial-detail" class="memorial-detail" aria-live="polite" hidden></section>
<section class="month-directory"><h2 id="list-heading">Meldados for Tishrei</h2><div id="month-list"></div></section>
<section class="today-memorials"><h2>Today's Meldados</h2><p id="today-note"></p><div id="today-list"></div></section>
</main><script src="assets/meldados.js"></script></body></html>
