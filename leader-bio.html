<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership Biography | CTI</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/CTI-logo-web.png" class="brand-logo" alt="Congregation Tifereth Israel"></a><nav class="links"><a href="leadership.html">Leadership Team</a><a href="index.html">Home</a></nav></div></header><main><section class="page-hero"><div class="wrap"><div class="eyebrow">Leadership Team</div><h1 id="leader-name">Biography</h1><p class="lead" id="leader-role"></p></div></section><section><div class="wrap content"><div id="bio-content"><p>Loading biography…</p></div><p><a href="leadership.html">← Back to Leadership Team</a></p></div></section></main><script src="assets/site.js"></script><script>(function(){const name=new URLSearchParams(location.search).get('name');fetch('content/leadership-bios.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{const leader=(d.leaders||[]).find(x=>x.name===name);if(!leader)throw Error('Leader not found');document.getElementById('leader-name').textContent=leader.name;document.title=leader.name+' | CTI Leadership';const box=document.getElementById('bio-content');box.replaceChildren();for(const t of (leader.fullBio||leader.bio).split(/\n\s*\n/).filter(Boolean)){const p=document.createElement('p');p.textContent=t;box.append(p)}}).catch(()=>document.getElementById('bio-content').textContent='Biography unavailable.')})();</script></body></html>
