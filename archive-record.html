<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Archive Record</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/images/branding/CTI-logo-web.png" alt="CTI"></a><nav class="links"><a href="press.html">Press & Archives</a></nav></div></header><main><section class="page-hero"><div class="wrap"><a href="press.html">← Press & Archives</a><div class="eyebrow" id="source">Historical Archive</div><h1 id="title">Archive record</h1><p class="lead" id="date"></p></div></section><section><div class="wrap grid grid-2"><div><a id="original" class="archive-image-link"><img id="scan" class="archive-image" alt="Original archival image"></a><p class="archive-source" id="citation"></p><p id="source-note" class="meta"></p><p id="pdf-link" hidden><a id="pdf-anchor" class="btn" target="_blank" rel="noopener">View associated PDF</a></p></div><article class="card archive-transcript"><h2>Restored photograph</h2><a id="restored-link" target="_blank" rel="noopener"><img id="restored-photo" class="archive-image" alt="Restored photograph from the archival article" style="width:100%;max-height:420px;object-fit:contain"></a><p id="restored-caption" class="meta"></p><h2>Transcription</h2><div id="transcript"></div></article></div></section></main><script src="assets/site.js?v=20261020-nav2"></script><script>(async function(){const id=new URLSearchParams(location.search).get('id');try{const d=await fetch('content/collection-records.json',{cache:'no-cache'}).then(r=>r.json());const x=d.items.find(x=>x.id===id&&x.status==='active');if(!x)throw Error('Record unavailable');document.title=x.title+' | CTI';for(const key of ['title','date','source','citation'])document.getElementById(key).textContent=x[key]||'';const image=x.originalImage||x.archiveImage||x.indexImage;const restored=x.restoredImage||x.indexImage||x.thumbnailImage||x.archiveImage;const photo=document.getElementById('restored-photo'),photoLink=document.getElementById('restored-link');if(restored){photo.src=restored;photoLink.href=restored;photo.alt='Restored presentation image: '+x.title}else{photo.hidden=true;photoLink.hidden=true}document.getElementById('restored-caption').textContent=x.caption||x.title;document.getElementById('source-note').textContent=x.originalImage?'Preserved source scan; select the image to inspect it.':'Original article scan not yet linked; displaying the available record image provisionally.';const scan=document.getElementById('scan'),original=document.getElementById('original');if(image){scan.src=image;scan.alt=x.title;original.href=image}else{scan.hidden=true}if(x.pdf){document.getElementById('pdf-anchor').href=x.pdf;document.getElementById('pdf-link').hidden=false}const transcript=document.getElementById('transcript');transcript.replaceChildren();if(x.description){const p=document.createElement('p');p.textContent=x.description;transcript.append(p)}if(x.transcript){for(const para of x.transcript.split(/\n\s*\n/)){const p=document.createElement('p');p.textContent=para;transcript.append(p)}}if(x.sourcePage){const p=document.createElement('p'),a=document.createElement('a');a.href=x.sourcePage;a.textContent='View preserved historical source page';p.append(a);transcript.append(p)}if(!x.transcript&&!x.description){const p=document.createElement('p');p.textContent='Original historical material is available through the preserved source page.';transcript.prepend(p)}}catch(e){document.getElementById('transcript').textContent='This record is unavailable.'}})();</script></body></html>
