<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Archive Record</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/images/branding/CTI-logo-web.png" alt="CTI"></a><nav class="links"><a href="press.html">Press & Archives</a></nav></div></header><main><section class="page-hero"><div class="wrap"><a href="press.html">← Press & Archives</a><div class="eyebrow" id="source">Historical Archive</div><h1 id="title">Archive record</h1><p class="lead" id="date"></p></div></section><section><div class="wrap grid grid-2"><div><a id="original" class="archive-image-link"><img id="scan" class="archive-image" alt="Original archival image"></a><p class="archive-source" id="citation"></p><p id="pdf-link" hidden><a id="pdf-anchor" class="btn" target="_blank" rel="noopener">View associated PDF</a></p></div><article class="card archive-transcript"><h2>Transcription</h2><div id="transcript"></div></article></div></section></main><script src="assets/site.js?v=20261020-nav2"></script><script>(function(){const id=new URLSearchParams(location.search).get('id');Promise.all([fetch('content/archive-additions.json',{cache:'no-cache'}).then(r=>r.json()),fetch('content/collection-submissions.json',{cache:'no-cache'}).then(r=>r.json())]).then(([d,registry])=>{const item=(registry.items||[]).find(x=>x.id===id&&x.collection==='archive'&&x.status==='active')||(registry.visibility?.archive?.[id]!=='inactive'?(d.items||[]).find(x=>x.id===id):null);if(!item)throw Error('Not found');document.title=item.title+' | CTI Archive';for(const k of ['title','date','source','citation'])document.getElementById(k).textContent=item[k]||'';document.getElementById('scan').src=item.archiveImage||item.image;document.getElementById('scan').alt=item.title+' — original archival image';document.getElementById('original').href=item.archiveImage||item.image;if(item.pdf){document.getElementById('pdf-anchor').href=item.pdf;document.getElementById('pdf-link').hidden=false;}const body=document.getElementById('transcript');for(const t of (item.transcript||'').split(/\n\s*\n/).filter(Boolean)){const p=document.createElement('p');p.textContent=t;body.append(p)}}).catch(()=>document.getElementById('transcript').textContent='This archival record is unavailable.')})();</script></body></html>
