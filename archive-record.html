<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Archive Record</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/images/branding/CTI-logo-web.png" alt="CTI"></a><nav class="links"><a href="press.html">Press & Archives</a></nav></div></header><main><section class="page-hero"><div class="wrap"><a href="press.html">← Press & Archives</a><div class="eyebrow" id="source">Historical Archive</div><h1 id="title">Archive record</h1></div></section><section><div class="wrap grid grid-2"><div><a id="original" class="archive-image-link"><img id="scan" class="archive-image" alt="Original archival image"></a><div class="archive-source" id="attribution-block"><p id="attribution" hidden></p><p id="citation" hidden></p><p id="source-note" class="meta"></p></div><p id="special-thanks" class="archive-source" hidden></p><div id="attachments" class="archive-attachments" hidden><h3>Attached documents</h3><ul id="attachment-list"></ul></div></div><article class="card archive-transcript"><p id="date" class="meta" style="margin-top:0;font-weight:600"></p><div id="transcript"></div></article></div></section></main><script src="assets/site.js?v=20261020-nav2"></script><script>(async function(){const id=new URLSearchParams(location.search).get('id');try{const d=await fetch('content/collection-records.json',{cache:'no-cache'}).then(r=>r.json());const x=d.items.find(x=>x.id===id&&x.status==='active');if(!x)throw Error('Record unavailable');document.title=x.title+' | CTI';for(const key of ['title','date'])document.getElementById(key).textContent=x[key]||'';const attribution=document.getElementById('attribution');if(x.attribution){attribution.textContent='Attribution: '+x.attribution;attribution.hidden=false}const citation=document.getElementById('citation');const citationText=[x.source,x.citation].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');if(citationText){citation.textContent=citationText;citation.hidden=false}const thanks=document.getElementById('special-thanks');if(x.providedBy){thanks.textContent='Special thanks to '+x.providedBy+' for providing this historical record.';thanks.hidden=false}const image=x.originalImage||x.archiveImage||x.indexImage;const scan=document.getElementById('scan'),original=document.getElementById('original');if(image){scan.src=image;scan.alt=x.title;original.href=image}else{scan.hidden=true}const docs=[];if(x.pdf)docs.push({path:x.pdf,label:'Associated PDF'});if(x.associatedSourceDocument?.path)docs.push({path:x.associatedSourceDocument.path,label:x.associatedSourceDocument.description||'Source document'});if(x.associatedHistoricalRecord)docs.push({path:x.associatedHistoricalRecord,label:'Related historical record'});if(x.sourcePage)docs.push({path:x.sourcePage,label:'Read complete preserved article'});if(docs.length){const list=document.getElementById('attachment-list');for(const doc of docs){const li=document.createElement('li'),a=document.createElement('a');a.href=doc.path;a.target='_blank';a.rel='noopener';a.textContent=doc.label;li.append(a);list.append(li)}document.getElementById('attachments').hidden=false}const transcript=document.getElementById('transcript');transcript.replaceChildren();if(x.articleHtml){const parsed=new DOMParser().parseFromString('<article>'+x.articleHtml+'</article>','text/html');const allowed=new Set(['P','DIV','H2','H3','H4','STRONG','EM','B','I','UL','OL','LI','BLOCKQUOTE','TIME','BR','SPAN','A']);function safeNode(node){if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();const tag=allowed.has(node.tagName)?node.tagName.toLowerCase():'span';const el=document.createElement(tag);if(tag==='a'){const href=node.getAttribute('href')||'';if(!/^javascript:/i.test(href))el.href=href}for(const child of node.childNodes)el.append(safeNode(child));return el}for(const child of parsed.body.firstElementChild.childNodes)transcript.append(safeNode(child))}else if(x.description){const p=document.createElement('p');p.textContent=x.description;transcript.append(p)}if(!x.articleHtml&&x.transcript){for(const para of x.transcript.split(/\n\s*\n/)){const p=document.createElement('p');p.textContent=para;transcript.append(p)}}if(!x.articleHtml&&!x.transcript&&!x.description){const p=document.createElement('p');p.textContent='Original historical material is available through the preserved source page.';transcript.prepend(p)}}catch(e){document.getElementById('transcript').textContent='This record is unavailable.'}})();</script></body></html>
