<section><div class="wrap"><div class="torah-actions"><a class="btn" href="torah.html">← All D’vrei Torah</a><a id="podcast" class="btn" href="#" target="_blank" rel="noopener noreferrer" hidden>Listen to podcast ↗</a></div><article id="reading" class="content torah-reading" aria-live="polite"></article></div></section></main>

<script src="assets/site.js"></script><script src="assets/torah-files.js"></script><script src="assets/torah-markdown.js"></script><script>
(async function(){
 const title=document.getElementById('title'),reading=document.getElementById('reading');
 try{
 const id=new URLSearchParams(location.search).get('id');
 if(!id)throw Error('No D’var Torah was selected.');
 const response=await fetch('content/dvar-torah/index.json',{cache:'no-store'});
 if(!response.ok)throw Error('The D’var Torah catalog could not be loaded.');
 const catalog=await response.json(),record=CTITorahFiles.find(catalog.items||[],id);
 if(!record||record.status!=='published')throw Error('This D’var Torah is not available.');
 const path=CTITorahFiles.path(record,'Reader');
 const file=await fetch(path);
 if(!file.ok)throw Error('The published Reader Edition is temporarily unavailable.');
 const markdown=await file.text();
 title.textContent=record.title||record.name;document.title=(record.title||record.name)+' | CTI';
 document.getElementById('eyebrow').textContent=record.eyebrow||'D’var Torah';
 document.getElementById('byline').textContent=record.byline||'Rabbi Phillip Blue';
 // The title is displayed in the page heading; do not duplicate its Markdown H1.
 reading.innerHTML=CTITorahMarkdown.render(markdown.replace(/^\s*#\s+[^\n]+\n/, '').trim());
 const link=record.podcast;
 if(typeof link==='string'&&/^https:\/\//.test(link)){const a=document.getElementById('podcast');a.href=link;a.hidden=false;}
 }catch(e){title.textContent='D’var Torah unavailable';reading.textContent=e.message;console.error(e)}
})();
</script></body></html>
