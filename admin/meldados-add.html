<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Meldatho — CTI Administration</title><style>body{font:16px system-ui,sans-serif;background:#f6f7f9;color:#193444;margin:0}main{max-width:650px;margin:35px auto;padding:20px}.card{background:white;padding:26px;border:1px solid #d9e0e4;border-radius:12px}label{display:block;font-weight:600;margin:18px 0 6px}input,select{font:inherit;padding:11px;width:100%;box-sizing:border-box}input[type=radio]{width:auto}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:600;margin-bottom:8px}.option{font-weight:400;margin:8px 0}button{background:#174a66;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.55}a{color:#145674}#status{white-space:pre-wrap;margin-top:16px}#result{margin-top:15px}[hidden]{display:none!important}</style></head><body><main id="content" hidden><p><a href="index.html">← Administration</a></p><div class="card"><h1>Add Meldatho</h1><p>Create a memorial record. Its name-based ID is assigned once and remains unchanged if the name is corrected later.</p><form id="form"><label for="name">Full name</label><input id="name" required maxlength="200" autocomplete="off"><fieldset><legend>Memorial date</legend><label class="option"><input type="radio" name="mode" value="hebrew" checked> Hebrew month and day</label><label class="option"><input type="radio" name="mode" value="english"> English date of death</label></fieldset><div id="hebrew"><label for="month">Hebrew month</label><select id="month"></select><label for="day">Hebrew day</label><input id="day" type="number" min="1" max="30" value="1" required></div><div id="english" hidden><label for="date">English date of death</label><input id="date" type="date"><fieldset><legend>Time of death</legend><label class="option"><input type="radio" name="sunset" value="before" checked> Before sunset</label><label class="option"><input type="radio" name="sunset" value="after"> After sunset</label></fieldset></div><p>Before saving, check that the name and memorial date are correct. Existing names are checked for possible duplicates.</p><button id="submit" type="submit">Create Meldatho</button><p id="status" role="status"></p><p id="result" hidden></p></form></div></main><script src="cti-auth.js?v=1"></script><script src="meldados-add.js?v=1"></script></body></html>
