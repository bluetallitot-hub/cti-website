<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Newsletter Upload</title><style>body{font:17px system-ui,sans-serif;margin:0;background:#f6f7f9;color:#193444}main{max-width:680px;margin:35px auto;padding:20px}.panel{background:white;border:1px solid #d9e0e4;border-radius:12px;padding:24px}input,button{font:inherit}input[type=file]{display:block;margin:18px 0;width:100%}button{background:#174a66;color:white;border:0;border-radius:7px;padding:13px 20px;cursor:pointer}button:disabled{opacity:.5}a{color:#135c7a}#status{line-height:1.5;font-weight:600}footer{margin-top:32px;padding-top:16px;border-top:1px solid #d9e0e4}</style></head><body><main><h1>Upload Newsletter</h1><p>Choose the newsletter PDF. The website will identify the issue date and add it to the newsletter archive.</p><section class="panel"><label for="pdf"><strong>Newsletter PDF</strong></label><input id="pdf" type="file" accept=".pdf,application/pdf"><div id="details"></div><button id="upload" disabled>Upload Newsletter</button><p id="status" role="status"></p></section><footer><a href="index.html">← Back to Administration</a></footer></main><script src="cti-auth.js?v=1"></script><script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const pdf=document.getElementById('pdf'),button=document.getElementById('upload'),status=document.getElementById('status'),details=document.getElementById('details');
let month='',volume='';
pdf.onchange=async()=>{
 month='';volume='';button.disabled=true;details.replaceChildren();status.textContent='';
 const file=pdf.files[0];if(!file)return;
 if(file.size>7*1024*1024){status.textContent='PDF is too large (7 MB maximum).';return}
 try{
  const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const page=await doc.getPage(1),content=await page.getTextContent();
  const text=content.items.map(x=>x.str).join(' ').replace(/\s+/g,' ');
  const names='January February March April May June July August September October November December'.split(' ');
  const matches=[...text.matchAll(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+((?:19|20)\d{2})\b/gi)];
  const unique=[...new Set(matches.map(m=>m[2]+'-'+String(names.findIndex(n=>n.toLowerCase()===m[1].toLowerCase())+1).padStart(2,'0')))];
  if(unique.length!==1){status.textContent='Could not confidently identify a single issue month on the first page. Please contact the website administrator.';return}
  month=unique[0];
  const v=text.match(/\b(?:vol(?:ume)?\.?\s*\d+\s*[,;:-]?\s*(?:no\.?|number|issue|#)\s*\d+)/i);volume=v?v[0]:'';
  const p=document.createElement('p');p.textContent='Issue identified: '+names[Number(month.slice(5))-1]+' '+month.slice(0,4)+(volume?' — '+volume:'');details.append(p);
  button.disabled=false;
 }catch(e){status.textContent='Unable to read this PDF: '+e.message}
};
button.onclick=async()=>{
 if(!month||!pdf.files[0])return;
 button.disabled=true;status.textContent='Uploading newsletter…';
 try{
  await CTIAuth.requireRole(true);
  const bytes=new Uint8Array(await pdf.files[0].arrayBuffer());let binary='';
  for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  const result=await CTIAuth.api('/newsletter/upload',{pdf:btoa(binary),month,volume});
  status.textContent=result.title+' uploaded successfully. Please allow up to 5 minutes for the website to refresh.';
  pdf.value='';month='';details.replaceChildren();
 }catch(e){status.textContent='Upload unsuccessful: '+e.message;button.disabled=false}
};
</script></body></html>
