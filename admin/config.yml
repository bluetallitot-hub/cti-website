backend:
  name: github
  repo: bluetallitot-hub/cti-website
  branch: main
  # GitHub Pages requires a separate OAuth authentication service.
  # Configure base_url and auth_endpoint after deploying that service.
media_folder: assets/uploads
public_folder: /cti-website/assets/uploads
site_url: https://bluetallitot-hub.github.io/cti-website/
display_url: https://bluetallitot-hub.github.io/cti-website/
logo_url: /cti-website/assets/images/branding/CTI-logo-web.png
collections:
  - name: settings
    label: Website Settings
    files:
      - name: services
        label: Service Schedule
        file: content/services.json
        format: json
        fields:
          - label: Services
            name: services
            widget: list
            summary: "{{fields.date}} — {{fields.time}} ({{fields.location}})"
            fields:
              - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: Time, name: time, widget: string, default: "7:30 PM"}
              - {label: Location, name: location, widget: select, options: ["In person", "Zoom only", "Hybrid"]}
              - {label: Description, name: description, widget: string, required: false}
  - name: biographies
    label: Biographies
    folder: content/biographies
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - {label: Name, name: title, widget: string}
      - {label: Position, name: role, widget: string, required: false}
      - {label: Photograph, name: image, widget: image, required: false}
      - {label: Biography, name: body, widget: markdown}
  - name: articles
    label: History and Articles
    folder: content/articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text, required: false}
      - {label: Article, name: body, widget: markdown}
  - name: sermons
    label: D'vrei Torah
    folder: content/dvar-torah
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Parasha, name: parasha, widget: string}
      - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Sermon, name: body, widget: markdown}
  - name: transcriptions
    label: Archival Transcriptions
    folder: content/archive-transcriptions
    create: true
    slug: "{{slug}}"
    extension: txt
    format: raw
    fields:
      - {label: Verbatim transcription, name: body, widget: text}
