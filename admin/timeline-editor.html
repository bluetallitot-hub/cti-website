<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Timeline Editor</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#f6f7f9;color:#193444}main{max-width:950px;margin:35px auto;padding:20px}a{color:#145674}.panel{background:white;border:1px solid #d9e0e4;border-radius:12px;padding:20px}input[type=search]{padding:12px;width:100%;box-sizing:border-box;font:inherit;margin:10px 0}button{padding:12px 18px;border:0;border-radius:6px;background:#174a66;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.entry{display:flex;align-items:center;gap:12px;border-top:1px solid #e3e8eb;padding:10px 0}.entry img{width:72px;height:54px;object-fit:cover;border-radius:4px}.entry label{flex:1;cursor:pointer}.muted{color:#52636b;font-size:.9rem}#message{min-height:1.5em}</style></head><body><main hidden id="main"><p><a href="index.html">← Back to Administration</a> · <a href="../history-timeline.html">View Timeline</a></p><h1>Historical Timeline Editor</h1><p>Choose which Archive and Gallery entries appear on the Timeline. Changes do not affect the records themselves. Only active records with a date, title, and thumbnail can appear publicly.</p><div class="panel"><input id="search" type="search" placeholder="Search by record number, title, date, or collection" aria-label="Search historical records"><p><button id="all" type="button">Select all</button> <button id="none" type="button">Clear all</button> <button id="save" type="button" disabled>Save Timeline Selection</button></p><p id="count"></p><div id="records"></div><p id="message" role="status"></p></div></main><script src="cti-auth.js?v=2"></script><script src="timeline-editor.js"></script></body></html>
