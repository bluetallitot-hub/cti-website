<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Publishing Connection Test</title><style>body{font:18px system-ui,sans-serif;background:#f5f6f5;color:#193444}main{max-width:650px;margin:65px auto;background:white;border:1px solid #ddd;border-radius:14px;padding:30px}button{background:#174a66;color:white;font:inherit;border:0;border-radius:8px;padding:16px;cursor:pointer}p{line-height:1.6}</style></head><body><main><p><a href="index.html">← Administration</a></p><h1>Check GitHub connection</h1><p>This test reads the memorial file through Cloudflare. It does not change any memorial or publish anything.</p><button id="check">Test connection</button><p id="result" role="status"></p></main><script src="cti-auth.js?v=1"></script><script>document.getElementById('check').onclick=async()=>{const out=document.getElementById('result');out.textContent='Checking…';try{await CTIAuth.requireRole(true);const r=await CTIAuth.api('/github-check');out.textContent=r.ok?'Success! Cloudflare can read the CTI GitHub repository.':'Connection failed.'}catch(e){out.textContent='Connection not verified: '+e.message}}</script></body></html>
