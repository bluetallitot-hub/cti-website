<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming Events | CTI Administration</title><style>body{font:17px system-ui,sans-serif;background:#f6f7f9;color:#193444;margin:0}main{max-width:760px;margin:35px auto;padding:20px}.panel{background:#fff;border:1px solid #d9e0e4;border-radius:12px;padding:24px;margin:18px 0}label{display:block;font-weight:650;margin:15px 0 6px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;padding:10px;border:1px solid #9aaeb9;border-radius:6px}button{background:#174a66;color:#fff;border:0;border-radius:7px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#e5edf1;color:#193444}a{color:#135c7a}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.event{border-top:1px solid #d9e0e4;padding:14px 0}.event p{margin:6px 0}@media(max-width:550px){.row{grid-template-columns:1fr}}</style></head><body><main id="main" hidden><p><a href="index.html">← Administration</a></p><h1>Upcoming Events</h1><p>Add events to the public Events and Services page. Review before publishing. Existing events can also be removed.</p><section class="panel"><h2>Add an Event</h2><form id="form"><label for="title">Event name *</label><input id="title" maxlength="140" required placeholder="e.g., Ladies Auxiliary Luncheon"><div class="row"><div><label for="date">Date *</label><input id="date" type="date" required></div><div><label for="time">Time</label><input id="time" maxlength="80" placeholder="e.g., 12:30 PM"></div></div><label for="location">Location</label><input id="location" maxlength="160" placeholder="e.g., CTI Social Hall"><label for="description">Description</label><textarea id="description" rows="4" maxlength="1500" placeholder="What should congregants know?"></textarea><p><button type="submit">Review Event</button></p></form><div id="preview" hidden><h3>Review before publishing</h3><div id="preview-text"></div><p><button id="save">Publish Event</button> <button id="cancel" class="secondary">Edit Details</button></p></div><p id="status" role="status"></p></section><section class="panel"><h2>Published Events</h2><div id="list">Loading events…</div></section></main><script src="cti-auth.js?v=1"></script><script>
const $=id=>document.getElementById(id);let pending=null,events=[];
const format=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
function render(){const root=$('list');root.replaceChildren();if(!events.length){root.textContent='No events published yet.';return}events.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const card=document.createElement('div');card.className='event';const h=document.createElement('strong');h.textContent=e.title;const p=document.createElement('p');p.textContent=format(e.date)+(e.time?' · '+e.time:'')+(e.location?' · '+e.location:'');card.append(h,p);if(e.description){const d=document.createElement('p');d.textContent=e.description;card.append(d)}const b=document.createElement('button');b.className='secondary';b.textContent='Remove Event';b.onclick=async()=>{if(!confirm('Remove '+e.title+' on '+format(e.date)+' from the public website?'))return;b.disabled=true;try{await CTIAuth.api('/events/delete',{id:e.id,date:e.date,title:e.title});$('status').textContent='Event removed.';await load()}catch(err){$('status').textContent=err.message;b.disabled=false}};card.append(b);root.append(card)})}
async function load(){const r=await CTIAuth.api('/events/list');events=r.events||[];render()}
$('form').onsubmit=e=>{e.preventDefault();pending={title:$('title').value.trim(),date:$('date').value,time:$('time').value.trim(),location:$('location').value.trim(),description:$('description').value.trim()};if(!pending.title||!pending.date)return;$('preview-text').textContent=pending.title+' — '+format(pending.date)+(pending.time?' · '+pending.time:'')+(pending.location?' · '+pending.location:'')+(pending.description?'\n'+pending.description:'');$('preview-text').style.whiteSpace='pre-line';$('preview').hidden=false;$('save').focus()};
$('cancel').onclick=()=>{$('preview').hidden=true;pending=null};
$('save').onclick=async()=>{if(!pending)return;$('save').disabled=true;$('status').textContent='Publishing event…';try{await CTIAuth.api('/events/add',pending);$('status').textContent='Event published successfully. Website updates may take a few minutes.';$('form').reset();$('preview').hidden=true;pending=null;await load()}catch(err){$('status').textContent=err.message}finally{$('save').disabled=false}};
CTIAuth.requireRole(true).then(()=>{$('main').hidden=false;return load()}).catch(e=>{$('list').textContent=e.message});
</script></body></html>
