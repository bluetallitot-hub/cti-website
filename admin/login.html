<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTI Sign In</title><style>body{font:18px system-ui,sans-serif;background:#f4f4f1;color:#193444;margin:0}main{max-width:460px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #d4dadc;border-radius:14px;box-shadow:0 6px 25px #0001}h1{font-size:1.6rem}label{display:block;margin:24px 0 8px;font-weight:700}input{font:inherit;padding:15px;width:100%;box-sizing:border-box;border:1px solid #879aa5;border-radius:8px}button{font:inherit;background:#174a66;color:white;border:0;border-radius:8px;padding:15px 24px;cursor:pointer;margin-top:20px;width:100%}#status{min-height:1.5em}a{color:#145674}</style></head><body><main><p>Congregation Tifereth Israel</p><h1>Sign in to edit the website</h1><p>Enter the CTI administration password or the Meldados community password.</p><form id="login"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required autofocus><button>Sign in</button></form><p id="status" role="status"></p><p><a href="../meldados.html">Return to the memorial board</a></p></main><script src="cti-auth.js?v=1"></script><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='Checking password…';try{const r=await CTIAuth.login(document.getElementById('password').value);s.textContent='Signed in.';const next=new URLSearchParams(location.search).get('next');const safeNext=next&&next.startsWith('/cti-website/admin/')&&!next.includes('//')&&!next.includes('\\\\')?next:null;location.replace(safeNext||(r.role==='admin'?'index.html':'meldados-editor.html'+(new URLSearchParams(location.search).get('id')?'?id='+encodeURIComponent(new URLSearchParams(location.search).get('id')):'')))}catch(e){s.textContent=e.message}}</script></body></html>
