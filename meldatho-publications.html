<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTI Meldatho Publications — Preview</title>
<style>
:root{font-family:Georgia,serif;color:#203a48;background:#eef2f3}body{margin:0}.tools{font:15px system-ui,sans-serif;max-width:820px;margin:22px auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 14px}.tools a{margin-right:auto}select,button{font:inherit;padding:9px 12px;border:1px solid #a9b9c1;border-radius:5px;background:white}button{background:#174d65;color:white;cursor:pointer}.sheet{max-width:720px;min-height:1056px;display:flex;flex-direction:column;background:white;margin:0 auto 30px;padding:48px 52px;box-shadow:0 8px 28px #102f4020;box-sizing:border-box}.masthead{text-align:center;border-bottom:3px solid #b78b4d;padding-bottom:22px}.masthead img{width:180px;max-height:110px;object-fit:contain}.congregation{font:small-caps 22px Georgia,serif;letter-spacing:1px;margin:10px 0 0}.place{font:13px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#526a75}.eyebrow{text-align:center;text-transform:uppercase;letter-spacing:2px;font:12px system-ui,sans-serif;color:#8a683c;margin:34px 0 12px}.ladino{text-align:center;font-style:italic;font-size:17px;color:#785a37;margin:10px 0 4px}.translation{text-align:center;font:12px system-ui,sans-serif;color:#62717a;margin:0 0 18px}.blessing{margin-top:28px}#publication{display:flex;flex-direction:column;flex:1}.individual-publication{display:flex;flex-direction:column;flex:1}.individual-publication .blessing{margin-top:auto;padding-top:24px;margin-bottom:0}.individual-publication .tzedakah{text-align:center;margin:24px 0 8px}.individual-publication .tzedakah h2{text-align:center;text-transform:uppercase;letter-spacing:2px;font:12px system-ui,sans-serif;color:#8a683c;margin:0 0 12px}.individual-publication .tzedakah p{font-size:15px;line-height:1.45;margin:0}.individual-publication .blessing .translation{margin-bottom:0}.individual-publication .memorial-name{font-size:56px;line-height:1.15;white-space:nowrap;letter-spacing:-.035em;margin:14px calc(1.5in - 50vw) 8px;max-width:none;width:calc(8.5in - 3in);align-self:center;font-weight:700}.individual-publication .memorial-name.long-name{font-size:56px}@media(max-width:650px){.individual-publication .memorial-name{width:100%;margin-left:0;margin-right:0;font-size:clamp(22px,5.2vw,36px)}.individual-publication .memorial-name.long-name{font-size:clamp(20px,4.6vw,30px)}}.individual-publication .translation{font-family:'Times New Roman',Times,serif;font-size:29px;line-height:1.3;font-weight:600}.individual-publication .ladino{font-size:18px}.individual-publication .blessing .ladino{font-size:19px}.blessing .ladino{font-size:18px}h1{text-align:center;font-size:30px;line-height:1.2;margin:0 0 18px;color:#173e54}.subtitle{text-align:center;font-size:17px;margin:0 0 28px}.individual-publication .subtitle{font-size:14pt}.service{border:2px solid #174d65;padding:25px 18px;text-align:center;margin:26px 0}.service .date{font-size:28px;font-weight:bold}.service .time{font-size:33px;font-weight:bold;color:#174d65;margin:8px}.service .location{font:17px system-ui,sans-serif}.section-title{border-bottom:1px solid #b78b4d;padding-bottom:8px;margin:30px 0 15px;font-size:21px}.entries{width:100%;border-collapse:collapse}.entries td{border-bottom:1px solid #e5e9ea;padding:9px 5px;vertical-align:top}.entries .day{width:105px;color:#526a75;white-space:nowrap}.entries .remembered{font-size:13px;color:#546671;margin-top:4px}.notice{text-align:center;font-size:17px;line-height:1.6;margin:20px 0}.footer{text-align:center;border-top:1px solid #d6dedf;margin-top:10px;padding-top:15px;color:#586b74;font-size:12px}.error{color:#9a3030;font:14px system-ui,sans-serif;text-align:center}@media print{@page{size:letter;margin:0}body{background:white}.tools{display:none}.sheet{margin:0;max-width:none;min-height:11in;box-shadow:none;padding:.65in .7in}.entries tr{break-inside:avoid}.service{break-inside:avoid}}@media(max-width:650px){.sheet{padding:25px 22px;min-height:0}.service .time{font-size:27px}}
</style></head><body>
<div class="tools"><a href="admin/index.html">← Back to Administration</a><label for="edition">Edition</label><select id="edition"><option value="individual">Individual candle-lighting</option><option value="weekly">Weekly Meldathos</option><option value="monthly">Monthly service reminder</option></select><button id="print" type="button">Print / Save PDF</button></div>
<main class="sheet" id="sheet"><div class="masthead"><img src="assets/images/branding/CTI-logo-web.png" alt="CTI logo"><div class="congregation">Congregation Tifereth Israel</div><div class="place">Peabody, Massachusetts</div></div><div id="publication"><p class="notice">Loading approved memorial records…</p></div><div class="footer">Congregation Tifereth Israel · Peabody, Massachusetts</div></main>
<script>
const root=document.getElementById('publication'),edition=document.getElementById('edition');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const months=['Tishrei','Cheshvan','Kislev','Tevet','Shevat','Adar','Adar I','Adar II','Nisan','Nissan','Iyar','Sivan','Tammuz','Av','Elul'];
const hebrew=d=>{const parts=new Intl.DateTimeFormat('en-u-ca-hebrew',{timeZone:'America/New_York',day:'numeric',month:'long',year:'numeric'}).formatToParts(d);return {day:Number(parts.find(p=>p.type==='day')?.value),month:parts.find(p=>p.type==='month')?.value||'',year:parts.find(p=>p.type==='year')?.value||''}};
const civil=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);
const dateFromISO=s=>new Date(s+'T12:00:00Z');const addDays=(d,n)=>new Date(d.getTime()+n*86400000);
const norm=m=>String(m||'').toLowerCase().replace(/nissan/g,'nisan').replace(/tishri/g,'tishrei').replace(/heshvan/g,'cheshvan').replace(/adar 1/g,'adar i').replace(/adar 2/g,'adar ii').trim();
const match=(p,h)=>Number(p.hebrewDay)===h.day&&norm(p.hebrewMonth)===norm(h.month);
const approved=p=>p.approved===true&&p.reviewStatus!=='unapproved'&&p.reviewStatus!=='inactive'&&p.englishName&&p.hebrewDay&&p.hebrewMonth;
let people=[],services=[];const sampleId=new URLSearchParams(location.search).get('sample');
function rows(records,showRemembered){return '<table class="entries"><tbody>'+records.map(({person,date})=>'<tr><td class="day">'+esc(date)+'</td><td><strong>'+esc(person.englishName)+'</strong>'+(showRemembered&&person.rememberedBy?'<div class="remembered">Remembered by '+esc(person.rememberedBy)+'</div>':'')+'</td></tr>').join('')+'</tbody></table>'}
function render(){const mode=edition.value;const today=dateFromISO(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));let html='';
if(mode==='individual'){const future=Array.from({length:750},(_,i)=>addDays(today,i));let found=null;if(sampleId){const p=people.find(p=>p.id===sampleId);if(p){const d=future.find(d=>match(p,hebrew(d)));if(d)found={p,d,h:hebrew(d)}}}else{for(const d of future){const h=hebrew(d),p=people.find(p=>match(p,h));if(p){found={p,d,h};break}}}if(!found){html='<p class="error">No matching upcoming approved memorial was found.</p>'}else{const {p,d,h}=found;html='<div class="individual-publication"><div class="ladino">En memoria i onra de muestro kerido...</div><div class="translation">In memory and honor of our dear...</div><h1 class="memorial-name'+(p.englishName.length>=23?' long-name':'')+'">'+esc(p.englishName)+'</h1><p class="subtitle">'+esc(h.day+' '+h.month+' '+h.year)+' · '+esc(civil(d))+'</p><div class="eyebrow">Meldatho candle-lighting</div><p class="notice">In our tradition, we light a memorial candle at sundown on the evening before the Meldatho.</p><p class="notice">For this anniversary, please light your candle at sundown on <strong>'+esc(civil(addDays(d,-1)))+'</strong>.</p><div class="tzedakah"><h2>Honoring Their Memory Through Tzedakah</h2><p>One of the beautiful traditions of Sephardic Judaism is to mark a Meldatho with an act of <em>tzedakah</em>—charity given in memory of a loved one. A gift to someone in need, or an act of kindness offered in their name, allows their memory to continue bringing goodness into the world. In this way, remembrance becomes more than something we hold in our hearts; it becomes something we carry forward through our actions.</p></div><div class="blessing"><p class="notice">On behalf of the Congregation Tifereth Israel community, we extend our warmest thoughts and prayers as you remember your loved one. May the memories you cherish continue to bring you comfort and peace.</p><div class="ladino">Su memorya sea para bendisiyón.</div><div class="translation">May their memory be for a blessing.</div></div></div>'}}
if(mode==='weekly'){const day=today.getUTCDay(),untilSunday=(7-day)%7||7,start=addDays(today,untilSunday),end=addDays(start,6),items=[];for(let i=0;i<7;i++){const d=addDays(start,i),h=hebrew(d);for(const p of people.filter(p=>match(p,h)))items.push({person:p,date:h.day+' '+h.month})}html='<div class="eyebrow">Congregational remembrance</div><h1>Weekly Meldathos</h1><div class="ladino">Kon muncho akodro i respeto.</div><div class="translation">With much remembrance and respect.</div><p class="subtitle">'+esc(civil(start))+' – '+esc(civil(end))+'</p>'+(items.length?rows(items,true):'<p class="notice">No approved Meldathos listed for this week.</p>')+'<div class="blessing"><div class="ladino">Su memorya sea para bendisiyón.</div><div class="translation">May their memory be for a blessing.</div></div>'}
if(mode==='monthly'){const service=services.filter(s=>s.date&&dateFromISO(s.date)>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!service){html='<p class="error">No upcoming service is scheduled.</p>'}else{const d=dateFromISO(service.date),h=hebrew(d),items=people.filter(p=>norm(p.hebrewMonth)===norm(h.month)).sort((a,b)=>a.hebrewDay-b.hebrewDay||a.englishName.localeCompare(b.englishName)).map(p=>({person:p,date:p.hebrewDay+' '+h.month}));html='<div class="eyebrow">You are invited</div><h1>'+esc(service.description||'Shabbat Service')+'</h1><div class="service"><div class="date">'+esc(civil(d))+'</div><div class="time">'+esc(service.time||'Time to be announced')+'</div><div class="location">'+esc(service.location||'Congregation Tifereth Israel')+'</div></div><h2 class="section-title">Meldathos for '+esc(h.month)+'</h2>'+(items.length?rows(items,false):'<p>No approved Meldathos listed for this month.</p>')+'<div class="blessing"><div class="ladino">Su memorya sea para bendisiyón.</div><div class="translation">May their memory be for a blessing.</div></div>'}}
root.innerHTML=html}
edition.addEventListener('change',render);document.getElementById('print').addEventListener('click',()=>window.print());
Promise.all([fetch('content/meldados.json').then(r=>{if(!r.ok)throw Error('Memorial database unavailable');return r.json()}),fetch('content/services.json').then(r=>{if(!r.ok)throw Error('Service schedule unavailable');return r.json()})]).then(([m,s])=>{people=(m.people||[]).filter(approved);services=s.services||[];render()}).catch(e=>root.innerHTML='<p class="error">'+esc(e.message)+'</p>');
</script></body></html>
