name: Localize CTI 2019 journal photo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-cti-2019-photo.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/localize_2019_photo.py
      - run: python scripts/build_collection_thumbnails.py
      - name: Commit local source and updated thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html content/collection-records.json content/thumbnail-build-manifest.json assets/images/archive/CTI-026-2019-jewish-journal-photo.png assets/collections/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve 2019 CTI journal photo locally and replace external homepage reference"
            git push
          fi
