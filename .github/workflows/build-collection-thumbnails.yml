name: Build CTI collection thumbnails
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_collection_thumbnails.py'
      - '.github/workflows/build-collection-thumbnails.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/build_collection_thumbnails.py
      - name: Commit thumbnails and master record links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/collection-records.json content/thumbnail-build-manifest.json assets/collections/
          if ! git diff --cached --quiet; then
            git commit -m "Generate CTI numbered collection thumbnails and register in master database"
            git push
          fi
