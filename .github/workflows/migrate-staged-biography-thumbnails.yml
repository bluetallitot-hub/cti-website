name: Migrate Staged CTI Biography Thumbnails
on:
  push:
    paths:
      - scripts/migrate_staged_biography_thumbnails.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cti-biography-images
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/migrate_staged_biography_thumbnails.py
      - name: Commit migration and database updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/new assets/biographies assets/staging-archive content/leaders.json
          if ! git diff --cached --quiet; then
            git commit -m "Migrate staged CTI-BIO thumbnails and update leader database"
            git pull --rebase origin main
            git push
          fi
