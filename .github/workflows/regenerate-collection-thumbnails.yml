name: Regenerate collection thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/regenerate_collection_thumbnails.py'
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/regenerate_collection_thumbnails.py
      - name: Commit generated thumbnails and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/collections content/collection-records.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 800x600 shared collection thumbnails"
            git push
          fi
