name: Reconcile CTI asset registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconcile-asset-registry.py'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild registry from preserved files
        run: python3 scripts/reconcile-asset-registry.py
      - name: Validate registry
        run: python3 scripts/validate-assets.py
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/asset-registry.json
          git diff --cached --quiet || (git commit -m "Reconcile Phase 3 asset registry with preserved media" && git push)
