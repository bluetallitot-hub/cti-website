name: CTI Admin Tests
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'assets/service-calendar.js'
      - 'tests/**'
      - '.github/workflows/admin-tests.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'assets/service-calendar.js'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test admin pages and calendar rules
        run: node tests/admin-smoke.cjs
