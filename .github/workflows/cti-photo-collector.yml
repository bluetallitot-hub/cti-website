name: CTI Private Photo Collector
on:
  workflow_dispatch:
    inputs:
      write_files:
        description: 'Upload reviewed original images to private Drive (default: dry run)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cti-photo-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/photo_collector_requirements.txt
      - name: Collect into private pending Drive folder
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CTI_PHOTO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          COLLECTOR_WRITE: ${{ inputs.write_files }}
        run: python scripts/photo_collector.py
