name: CTI private photo collector
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write approved original images to Drive (false = dry run)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: cti-photo-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: photo-collector/requirements.txt
      - run: pip install -r photo-collector/requirements.txt
      - name: Check authentication is configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CTI_PHOTO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing CTI_PHOTO_GOOGLE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
      - name: Collect approved originals (or preview)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CTI_PHOTO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          if [ "$EXECUTE" = "true" ]; then
            python photo-collector/collect.py --execute
          else
            python photo-collector/collect.py
          fi
