name: CTI Photo Collector
on:
  workflow_dispatch:
    inputs:
      write_files:
        description: 'Commit verified, rights-cleared photos to the public CTI repository'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cti-photo-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Download approved photos
        env:
          COLLECTOR_WRITE: ${{ inputs.write_files }}
        run: python scripts/photo_collector.py
      - name: Commit approved photographs
        if: ${{ inputs.write_files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meldados/collected/
          if git diff --cached --quiet; then
            echo "No new approved photographs"
          else
            git commit -m "Collect approved CTI memorial photographs"
            git push
          fi
