name: CTI Public Website Regression Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/cti-admin-api.js'
      - 'tests/**'
      - '.github/workflows/cti-regression.yml'
  schedule:
    - cron: "23 11 * * *"
  workflow_run:
    workflows: ["Deploy CTI Website to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  public-crawl:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages to settle
        if: github.event_name == 'workflow_run'
        run: sleep 30
      - name: Check admin authentication wiring
        id: admin
        continue-on-error: true
        run: set -o pipefail; python3 tests/test_admin_source.py | tee cti-admin-audit.txt
      - name: Audit existing public content data
        id: content
        continue-on-error: true
        run: set -o pipefail; python3 tests/test_content.py | tee cti-content-audit.txt
      - name: Check public subscription wiring and safeguards
        id: subscriptions
        continue-on-error: true
        run: set -o pipefail; python3 tests/test_subscription_source.py | tee cti-subscriptions-audit.txt
      - name: Install browser test dependencies
        id: browser-deps
        continue-on-error: true
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Exercise subscription forms in a real browser with mocked API
        id: browser
        continue-on-error: true
        if: steps.browser-deps.outcome == 'success'
        run: set -o pipefail; python3 tests/test_subscription_browser.py | tee cti-browser-audit.txt
      - name: Verify Cloudflare API health and anonymous access denial
        id: api
        continue-on-error: true
        run: set -o pipefail; python3 tests/test_api.py | tee cti-api-audit.txt
      - name: Run read-only website checks
        id: crawl
        continue-on-error: true
        run: python3 tests/test_site.py
      - name: Report browser dependency installation failure
        if: steps.browser-deps.outcome == 'failure'
        run: echo 'Browser dependency installation failed; browser tests were not run.' | tee cti-browser-audit.txt
      - name: Upload detailed CSV and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cti-public-regression-results
          path: |
            cti-test-results.csv
            cti-test-results.json
            cti-content-audit.txt
            cti-admin-audit.txt
            cti-api-audit.txt
            cti-subscriptions-audit.txt
            cti-browser-audit.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Fail job if any public checks failed
        if: steps.crawl.outcome == 'failure' || steps.content.outcome == 'failure' || steps.admin.outcome == 'failure' || steps.api.outcome == 'failure' || steps.subscriptions.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.browser-deps.outcome == 'failure'
        run: exit 1
