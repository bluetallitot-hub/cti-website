name: Package CTI Biography Originals
on:
  push:
    paths:
      - scripts/package_biography_originals.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cti-biography-images
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build downloadable ZIP
        run: python scripts/package_biography_originals.py
      - name: Commit ZIP to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/biographies/download/CTI-biography-originals.zip
          if ! git diff --cached --quiet; then
            git commit -m "Package CTI biography originals for download"
            git pull --rebase origin main
            git push
          fi
