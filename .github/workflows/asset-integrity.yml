name: CTI asset registry integrity
on:
  push:
    paths:
      - 'assets/**'
      - 'content/asset-registry.json'
      - 'scripts/validate-assets.py'
      - '.github/workflows/asset-integrity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile metadata against preserved media files
        run: python3 scripts/reconcile-asset-registry.py
      - name: Check asset registry and quarantine integrity
        run: python3 scripts/validate-assets.py
      - name: Commit reconciled registry metadata
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/asset-registry.json
          git diff --cached --quiet || (git commit -m "Reconcile asset registry after Phase 3 cleanup" && git push)
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cti-asset-integrity
          path: backup-audit/asset-registry-validation.json
