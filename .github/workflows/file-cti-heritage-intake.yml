name: File CTI Heritage Intake Images
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/new/**"
      - "CTI-0*-*"
      - "scripts/file_heritage_intake.py"
permissions:
  contents: write
concurrency:
  group: cti-heritage-intake
  cancel-in-progress: false
jobs:
  file-heritage-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preview moves and identify conflicts
        run: python3 scripts/file_heritage_intake.py
      - name: Move verified record images and update references
        run: python3 scripts/file_heritage_intake.py --apply
      - name: Commit and push verified changes
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "File CTI-001 through CTI-038 intake assets into Heritage record folders"
            git push
          fi
      - name: Verify no matched images remain in intake
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("assets/new")
          repo_root=pathlib.Path(".")
          pat=re.compile(r"CTI-(?:00[1-9]|0[1-2][0-9]|03[0-8])-(?:ORG|ENH|THM|SEP|COL|DOC|IMG|THUMB)-[0-9]+\.(?:jpg|jpeg|png|webp|gif|pdf|tif|tiff)$",re.I)
          pending=[str(p) for base in (root,repo_root) for p in base.iterdir() if p.is_file() and pat.fullmatch(p.name)]
          if pending:
              print("REVIEW REQUIRED: recognized intake files still pending (conflicts): "+", ".join(pending))
          print("Verified: no recognized CTI-001..038 images remain in assets/new.")
          PY
