name: Update Blue Thread episodes
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh RSS catalog
        run: python scripts/sync-podcast.py
      - name: Commit updated podcast catalog
        run: |
          if ! git diff --quiet -- content/podcast-episodes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/podcast-episodes.json
            git commit -m "Refresh The Blue Thread RSS episode catalog"
            git push
          fi
