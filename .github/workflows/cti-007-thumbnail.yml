name: Build CTI-007 standardized thumbnail
on:
  push:
    paths:
      - "assets/heritage/CTI-007/CTI-007-ENH-2.png"
      - ".github/workflows/cti-007-thumbnail.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - name: Create 800x600 thumbnail without borders or caption
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          folder=Path("assets/heritage/CTI-007")
          source=Image.open(folder/"CTI-007-ENH-2.png").convert("RGB")
          thumb=ImageOps.fit(source,(800,600),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
          thumb.save(folder/"CTI-007-THM-1.png",optimize=True)
          assert Image.open(folder/"CTI-007-THM-1.png").size==(800,600)
          PY
      - name: Commit replacement thumbnail
        run: |
          git add assets/heritage/CTI-007/CTI-007-THM-1.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate CTI-007 800x600 thumbnail from enhanced image"
            git push
          fi
