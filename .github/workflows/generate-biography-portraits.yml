name: Create Existing Biography Portraits
on:
  push:
    paths:
      - scripts/generate_biography_portraits.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cti-biography-images
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'opencv-python-headless>=4.10,<5'
      - run: python scripts/generate_biography_portraits.py
      - name: Commit portrait thumbnails and record references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/leaders.json assets/biographies/
          if ! git diff --cached --quiet; then
            git commit -m "Generate and link CTI biography portrait thumbnails"
            git pull --rebase origin main
            git push
          fi
